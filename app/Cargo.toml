[package]
name = "leeep-connect"
version = "0.1.0"
description = "Leeep Connect Desktop Client"
authors = ["Leeep Technologies <support@leeep.in>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
url = "2.5"
dirs = "5.0"
sysinfo = "0.30"

[target.'cfg(windows)'.dependencies]
# Read the engine agent's NodeId from HKLM
winreg = "0.52"

[profile.release]
# Smaller download for schools on slow lines
lto = true
codegen-units = 1
strip = true
